[project]
name = "dealscout-agent"
version = "0.1.0"
description = "Autonomous agent for finding the best product deals in the Chilean market"
requires-python = ">=3.11"
dependencies = [
    # Core agent framework
    "deepagents>=0.1.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    # Web tools
    "tavily-python>=0.5.0",
    "firecrawl-py>=1.0.0",
    "google-search-results>=2.4.0",
    "httpx>=0.27.0",
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.0",
    # Schemas & validation
    "pydantic>=2.0.0",
    # CLI
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    # Utils
    "python-dotenv>=1.0.0",
    # Observability
    "langsmith>=0.1.0",
]

[project.scripts]
dealscout = "cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501: line too long — ignorar en system prompts y archivos de agentes (strings inevitablemente largos)
per-file-ignores = { "src/agent/*.py" = ["E501"], "src/utils/*.py" = ["E501"], "src/schemas/*.py" = ["E501"], "src/tools/*.py" = ["E501"], "tests/**/*.py" = ["E501", "E741"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires live API keys (deselect with -m 'not integration')",
]
